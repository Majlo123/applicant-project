server.address=127.0.0.1
server.port=${APP_BACKEND_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:postgresql://${APP_DB_HOST:127.0.0.1}:${APP_DB_PORT:5432}/${APP_DB_NAME:person_training}
spring.datasource.username=${APP_DB_USER:person_app}
spring.datasource.password=${APP_DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

app.seed-demo-data=${SEED_DEMO_DATA:false}
