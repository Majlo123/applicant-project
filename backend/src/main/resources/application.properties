server.address=127.0.0.1
server.port=${APP_BACKEND_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:postgresql://${APP_DB_HOST:127.0.0.1}:${APP_DB_PORT:5432}/${APP_DB_NAME:person_training}
spring.datasource.username=${APP_DB_USER:person_app}
spring.datasource.password=${APP_DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Bind LocalDate directly through JDBC; the default java.sql.Date conversion shifts historical dates (e.g. before 1583).
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
# Reject text after the JSON object and repeated keys (numbers/booleans for text fields: see JacksonConfiguration).
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

app.seed-demo-data=${SEED_DEMO_DATA:false}
